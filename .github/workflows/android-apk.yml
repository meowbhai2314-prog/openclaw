
name: Build OpenClaw Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: 6866e219d8ed1cadd539e5de2a2db20ac1c1a095

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Verify pnpm
        run: pnpm --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build third-party debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleThirdPartyDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-debug-apk
          path: apps/android/app/build/outputs/apk/thirdParty/debug/*.apk
          if-no-files-found: error
          retention-days: 7

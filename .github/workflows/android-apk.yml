
name: Build OpenClaw Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: 6866e219d8ed1cadd539e5de2a2db20ac1c1a095

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build third-party debug APK
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleThirdPartyDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-debug-apk
          path: apps/android/app/build/outputs/apk/thirdParty/debug/*.apk
          if-no-files-found: error
          retention-days: 7
